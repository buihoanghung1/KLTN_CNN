<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phát Hiện Xâm Nhập (IDS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 50px 0; margin-bottom: 30px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="hero text-center">
        <h1>DEMO HỆ THỐNG IDS</h1>
        <p>Phát hiện tấn công mạng dựa trên Deep Learning</p>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h4 class="mb-3 text-center">Tải lên file dữ liệu mạng (CSV)</h4>
                    <form action="/" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input class="form-control" type="file" name="file" accept=".csv" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Phân Tích Ngay</button>
                        </div>
                    </form>
                    <div class="mt-3 text-muted small text-center">
                        *Hệ thống hỗ trợ định dạng chuẩn UNSW-NB15
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% if error %}
      <div class="alert alert-danger text-center mt-2">{{ error }}</div>
    {% endif %}
</body>
</html>
